services:
  python-scheduler:
    container_name: python-scheduler
    build: .
    restart: unless-stopped
    environment:
      # Memberi tahu Python bahwa root project ada di /usr/src/app
      - PYTHONPATH=/usr/src/app
    volumes:
      # (Sangat disarankan) Mapping folder lokal ke dalam container, 
      # sehingga kalau Anda edit kode Python, tidak perlu rebuild image.
      - .:/usr/src/app